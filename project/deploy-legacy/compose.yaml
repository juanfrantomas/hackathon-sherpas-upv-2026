services:
  legacy:
    build:
      context: ../..
      dockerfile: project/deploy-legacy/Dockerfile
    env_file:
      - ./backend.env
    environment:
      VIRTUAL_HOST: ${DOMAIN:?Set DOMAIN in .env}
      VIRTUAL_PORT: 8000
      LETSENCRYPT_HOST: ${DOMAIN:?Set DOMAIN in .env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      DATABASE_URL: sqlite:////srv/project/backend/data/app.db
      VOICE_ALLOWED_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - legacy_data:/srv/project/backend/data
    networks:
      - proxy
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in .env}
volumes:
  legacy_data:

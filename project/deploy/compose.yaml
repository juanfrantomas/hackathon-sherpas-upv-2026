services:
  frontend:
    build:
      context: ../..
      dockerfile: project/deploy/Dockerfile.frontend
      args:
        VITE_BACKEND_API_URL: https://${DOMAIN:?Set DOMAIN in deploy/.env}
    environment:
      VIRTUAL_HOST: ${DOMAIN:?Set DOMAIN in deploy/.env}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${DOMAIN:?Set DOMAIN in deploy/.env}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
    volumes:
      - ./htpasswd:/etc/nginx/auth/htpasswd:ro
    networks:
      - proxy
      - internal
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ../..
      dockerfile: project/deploy/Dockerfile.backend
    env_file:
      - ./backend.env
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN in deploy/.env}
      CASES_DIR: /cases
      DATABASE_URL: sqlite:////app/data/app.db
      TTS_CACHE_DIR: /app/data/tts_cache
    volumes:
      - backend_data:/app/data
    networks:
      - internal
    restart: unless-stopped

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:?Set PROXY_NETWORK in deploy/.env}
  internal:

volumes:
  backend_data:

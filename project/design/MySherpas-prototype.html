<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MySherpas Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>/* ==========================================================================
   MySherpas design tokens
   Source status: the Sherpas Wealth CSS and product screenshots could not be
   fetched from this environment. Every value marked APPROX below is a visually
   faithful approximation of the brief's description (white / light-gray
   surfaces, blue accent, charcoal text, subtle borders). Replace with official
   values when the brand file is available.
   ========================================================================== */
:root {
  /* Brand blue (APPROX) */
  --sw-blue-700: #1f45b8;
  --sw-blue-600: #2a56d8;   /* primary action */
  --sw-blue-500: #4a72e6;
  --sw-blue-200: #c9d7fb;
  --sw-blue-100: #e3ebfd;
  --sw-blue-50:  #f2f6ff;
  --sw-gradient-soft: linear-gradient(180deg, #eef3ff 0%, #f8faff 55%, #ffffff 100%);   /* APPROX */
  --sw-gradient-accent: linear-gradient(135deg, #2a56d8 0%, #4a72e6 100%);              /* APPROX */

  /* Neutrals: charcoal with a slight blue bias (APPROX) */
  --ink-900: #1c2230;
  --ink-700: #3a4252;
  --ink-500: #5f6878;
  --ink-400: #8a92a1;
  --ink-300: #b9bfca;
  --line:    #e5e8ee;
  --line-soft: #eff1f5;
  --canvas:  #f6f7fa;
  --surface: #ffffff;

  /* Semantic (calm, never punitive) */
  --ok-600: #17845a;  --ok-50: #e9f6f0;
  --warn-600: #a46a12; --warn-50: #fbf3e4;
  --err-600: #b4433b; --err-50: #fbecea;

  /* Type: Inter is the closest widely used match for a Framer-built fintech site (APPROX) */
  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --fs-display: 28px; --lh-display: 34px;
  --fs-title: 22px;   --lh-title: 28px;
  --fs-h3: 17px;      --lh-h3: 24px;
  --fs-body: 15px;    --lh-body: 22px;
  --fs-small: 13px;   --lh-small: 18px;
  --fs-micro: 11px;   --lh-micro: 14px;

  /* Spacing (4px base) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;

  /* Radii */
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 24px; --r-pill: 999px;

  /* Shadows (minimal) */
  --sh-1: 0 1px 2px rgba(20, 30, 55, .05);
  --sh-2: 0 2px 8px rgba(20, 30, 55, .06), 0 1px 2px rgba(20, 30, 55, .04);
  --sh-3: 0 12px 32px rgba(20, 30, 55, .10);

  /* Motion */
  --ease: cubic-bezier(.2, .7, .2, 1);
  --dur-1: 160ms; --dur-2: 260ms; --dur-3: 420ms;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--font-sans);
  font-size: var(--fs-body); line-height: var(--lh-body);
  color: var(--ink-900); background: var(--canvas);
  -webkit-font-smoothing: antialiased;
  font-feature-settings: "cv11", "ss01";
}
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--sw-blue-500); outline-offset: 2px;
}
.num { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}

/* =========================== Type helpers =========================== */
.h-display { font-size: var(--fs-display); line-height: var(--lh-display); font-weight: 600; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.h-title { font-size: var(--fs-title); line-height: var(--lh-title); font-weight: 600; letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
.h3 { font-size: var(--fs-h3); line-height: var(--lh-h3); font-weight: 600; margin: 0; display: flex; align-items: center; gap: 8px; }
.small { font-size: var(--fs-small); line-height: var(--lh-small); }
.micro { font-size: var(--fs-micro); line-height: var(--lh-micro); }
.muted { color: var(--ink-500); }
.eyebrow { font-size: var(--fs-micro); line-height: var(--lh-micro); font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-500); }
.grow { flex: 1; min-width: 0; }
.stack-2 { display: grid; gap: var(--sp-2); }
.stack-3 { display: grid; gap: var(--sp-3); }
.stack-4 { display: grid; gap: var(--sp-4); }
.stack-5 { display: grid; gap: var(--sp-5); }
.row-2 { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.row-wrap { display: flex; gap: var(--sp-2); flex-wrap: wrap; }
.pad { padding: var(--sp-4) var(--sp-5) var(--sp-6); }
p { margin: 0; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--ink-500); }

/* =========================== Brand =========================== */
.wordmark { display: inline-flex; align-items: center; gap: 8px; font-weight: 650; letter-spacing: -0.01em; color: var(--ink-900); }
.wordmark--sm { font-size: 16px; } .wordmark--md { font-size: 18px; } .wordmark--lg { font-size: 24px; }
.wm-my { color: var(--sw-blue-600); }
.brand-mark { display: inline-grid; place-items: center; border-radius: 7px; background: var(--sw-blue-600); color: #fff; flex: none; }

/* =========================== Buttons =========================== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid transparent; border-radius: var(--r-md); font-weight: 600; cursor: pointer; transition: background var(--dur-1) var(--ease), border-color var(--dur-1), transform var(--dur-1); white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn--md { height: 44px; padding: 0 18px; font-size: 15px; }
.btn--lg { height: 52px; padding: 0 22px; font-size: 16px; border-radius: 14px; }
.btn--sm { height: 36px; padding: 0 12px; font-size: 13px; border-radius: 10px; }
.btn--block { width: 100%; }
.btn--primary { background: var(--sw-blue-600); color: #fff; }
.btn--primary:hover { background: var(--sw-blue-700); }
.btn--secondary { background: var(--surface); color: var(--ink-900); border-color: var(--line); }
.btn--secondary:hover { border-color: var(--ink-300); }
.btn--ghost { background: transparent; color: var(--sw-blue-700); }
.btn--ghost:hover { background: var(--sw-blue-50); }
.btn:disabled { background: var(--line-soft); color: var(--ink-400); border-color: transparent; cursor: not-allowed; transform: none; }
.link-btn { background: none; border: 0; padding: 0; color: var(--sw-blue-600); font-weight: 600; font-size: 14px; cursor: pointer; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; border: 0; background: transparent; color: var(--ink-700); cursor: pointer; position: relative; }
.icon-btn:hover { background: var(--line-soft); }
.icon-btn.is-on { color: var(--sw-blue-600); }
.icon-btn-sp { width: 40px; height: 40px; }
.has-dot::after { content: ""; position: absolute; top: 9px; right: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--sw-blue-600); box-shadow: 0 0 0 2px var(--surface); }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--sw-blue-100); color: var(--sw-blue-700); font-weight: 650; font-size: 13px; border: 0; cursor: pointer; flex: none; }
.avatar--sm { width: 32px; height: 32px; font-size: 12px; }
.avatar--lg { width: 52px; height: 52px; font-size: 17px; }

/* =========================== Cards, chips =========================== */
.card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: var(--sp-4); }
.card--tap { cursor: pointer; transition: border-color var(--dur-1), box-shadow var(--dur-1); }
.card--tap:hover { border-color: var(--sw-blue-200); box-shadow: var(--sh-2); }
.card--accent { background: var(--sw-gradient-soft); border-color: var(--sw-blue-100); }
.card--soft { background: var(--sw-blue-50); border-color: var(--sw-blue-100); }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: var(--r-pill); font-size: 12px; font-weight: 600; white-space: nowrap; }
.chip--neutral { background: var(--line-soft); color: var(--ink-700); }
.chip--blue { background: var(--sw-blue-50); color: var(--sw-blue-700); }
.chip--ok { background: var(--ok-50); color: var(--ok-600); }
.chip--warn { background: var(--warn-50); color: var(--warn-600); }
.demo-tag { display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 6px; border: 1px dashed var(--ink-300); color: var(--ink-500); font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap; flex: none; cursor: help; }
.approx { display: inline-block; font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--warn-600); background: var(--warn-50); border-radius: 5px; padding: 2px 6px; vertical-align: middle; }
.pill { height: 34px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid var(--line); background: var(--surface); color: var(--ink-700); font-size: 13.5px; font-weight: 550; cursor: pointer; white-space: nowrap; flex: none; transition: all var(--dur-1); }
.pill:hover { border-color: var(--ink-300); }
.pill.is-on { background: var(--ink-900); border-color: var(--ink-900); color: #fff; }
.pill--lg { height: 42px; font-size: 14.5px; }

.seg { display: inline-flex; background: var(--line-soft); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 36px; padding: 0 14px; border-radius: 9px; font-size: 14px; font-weight: 550; color: var(--ink-500); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button.is-on { background: var(--surface); color: var(--ink-900); box-shadow: var(--sh-1); }
.seg--md { display: flex; } .seg--md button { flex: 1; justify-content: center; }
.seg--sm button { height: 30px; font-size: 12.5px; padding: 0 10px; }

.toggle { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle__track { width: 44px; height: 26px; border-radius: 13px; background: var(--ink-300); position: relative; transition: background var(--dur-1); flex: none; }
.toggle__thumb { position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: var(--sh-1); transition: transform var(--dur-2) var(--ease); }
.toggle input:checked + .toggle__track { background: var(--sw-blue-600); }
.toggle input:checked + .toggle__track .toggle__thumb { transform: translateX(18px); }
.toggle input:focus-visible + .toggle__track { outline: 2px solid var(--sw-blue-500); outline-offset: 2px; }
.toggle__label { font-weight: 550; }

.field { display: grid; gap: 6px; }
.field__label { font-size: 13px; font-weight: 600; }
.field textarea, .field input { width: 100%; border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; font: inherit; color: var(--ink-900); background: var(--surface); resize: none; }
.field textarea:focus { outline: none; border-color: var(--sw-blue-500); box-shadow: 0 0 0 3px var(--sw-blue-100); }

.callout { display: flex; gap: 12px; padding: 14px 16px; border-radius: var(--r-md); background: var(--sw-blue-50); color: var(--ink-900); align-items: flex-start; }
.callout > .ic { color: var(--sw-blue-600); flex: none; margin-top: 1px; }
.callout strong { display: block; margin-bottom: 2px; }
.callout--warn { background: var(--warn-50); } .callout--warn > .ic { color: var(--warn-600); }
.callout--err { background: var(--err-50); } .callout--err > .ic { color: var(--err-600); }
.disclaimer { display: flex; gap: 6px; align-items: flex-start; font-size: 11.5px; line-height: 16px; color: var(--ink-400); }
.disclaimer .ic { flex: none; margin-top: 1px; }
.fineprint { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: var(--ink-500); text-align: center; }
.warn-text { color: var(--warn-600); }

/* Status icons */
.st { display: inline-grid; place-items: center; border-radius: 50%; flex: none; }
.st--todo { border: 1.5px solid var(--ink-300); background: var(--surface); }
.st--now { border: 1.5px solid var(--sw-blue-600); background: var(--surface); }
.st--now span { width: 40%; height: 40%; border-radius: 50%; background: var(--sw-blue-600); }
.st--done { background: var(--sw-blue-600); color: #fff; animation: pop var(--dur-3) var(--ease); }
.st--review { background: var(--warn-50); color: var(--warn-600); border: 1.5px solid #e8cf9e; }
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.08); } 100% { transform: scale(1); } }

/* Score ring */
.score-ring { position: relative; flex: none; }
.score-ring svg { display: block; }
.score-ring__val { transition: stroke-dasharray 900ms var(--ease); }
.score-ring__num { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 650; letter-spacing: -0.03em; color: var(--ink-900); padding-top: 4%; }
.score-ring__num small { font-size: 34%; color: var(--ink-400); font-weight: 500; position: absolute; bottom: 14%; letter-spacing: 0; }

/* =========================== Prototype shell =========================== */
.proto { min-height: 100%; display: flex; flex-direction: column; }
.proto-bar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); background: rgba(255,255,255,.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.proto-bar__brand { display: flex; align-items: center; gap: 10px; margin-right: auto; }
.proto-bar__tag { font-size: 11px; font-weight: 600; color: var(--ink-500); border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
.fam-select { display: grid; gap: 2px; }
.fam-select select { height: 34px; border: 1px solid var(--line); border-radius: 10px; padding: 0 10px; font: inherit; font-size: 13.5px; background: var(--surface); color: var(--ink-900); }

.stage { flex: 1; display: grid; grid-template-columns: 220px auto 260px; justify-content: center; gap: 40px; padding: 32px 16px 48px; align-items: start; }
.flow, .controls { position: sticky; top: 90px; display: grid; gap: 12px; }
.flow__h { text-transform: uppercase; letter-spacing: .08em; color: var(--ink-400); margin: 0; font-weight: 700; }
.flow ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.flow li button { width: 100%; display: flex; gap: 10px; align-items: center; border: 0; background: transparent; text-align: left; padding: 8px 10px; border-radius: 10px; font-size: 14px; color: var(--ink-700); cursor: pointer; }
.flow li button span { width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--line-soft); font-size: 11.5px; font-weight: 700; color: var(--ink-500); flex: none; }
.flow li button:hover { background: var(--surface); }
.flow li button.is-on { background: var(--surface); color: var(--ink-900); font-weight: 600; box-shadow: var(--sh-1); }
.flow li button.is-on span { background: var(--sw-blue-600); color: #fff; }
.flow__note { max-width: 210px; }
.ctl-block { display: grid; gap: 10px; padding: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.ctl-block .btn { max-width: 100%; min-width: 0; }
.ctl-block .btn span { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.state-grid { display: flex; flex-wrap: wrap; gap: 6px; }
.state-grid .pill { height: 30px; font-size: 12.5px; padding: 0 10px; }

/* Phone */
.phone-wrap { display: flex; justify-content: center; }
.phone { position: relative; width: 390px; height: 844px; border-radius: 48px; background: var(--surface); box-shadow: 0 0 0 10px #11141b, 0 0 0 11px #2a2f3a, var(--sh-3), 0 40px 80px rgba(20,30,55,.18); overflow: hidden; display: flex; flex-direction: column; }
.phone__status { height: 50px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 6px 30px 0 34px; font-weight: 600; font-size: 15px; position: relative; z-index: 5; background: transparent; }
.phone__island { position: absolute; left: 50%; top: 11px; width: 120px; height: 34px; border-radius: 20px; background: #0b0d12; transform: translateX(-50%); }
.phone__sig { display: flex; gap: 2px; align-items: flex-end; }
.phone__sig i { display: block; width: 3px; background: var(--ink-900); border-radius: 1px; }
.phone__sig i:nth-child(1) { height: 5px; } .phone__sig i:nth-child(2) { height: 8px; } .phone__sig i:nth-child(3) { height: 11px; }
.phone__sig b { display: block; width: 22px; height: 11px; border: 1.5px solid var(--ink-900); border-radius: 3px; margin-left: 6px; position: relative; }
.phone__sig b::after { content: ""; position: absolute; inset: 1.5px 5px 1.5px 1.5px; background: var(--ink-900); border-radius: 1px; }
.phone__screen { flex: 1; overflow-y: auto; overflow-x: hidden; position: relative; scrollbar-width: none; }
.phone__screen::-webkit-scrollbar { display: none; }
.phone__home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; border-radius: 3px; background: var(--ink-900); transform: translateX(-50%); z-index: 6; opacity: .85; }
.screen-anim { animation: screenIn var(--dur-3) var(--ease); min-height: 100%; display: flex; flex-direction: column; }
@keyframes screenIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.screen { flex: 1; display: flex; flex-direction: column; }
.screen--tabbed { padding-bottom: 96px; }

/* Tab bar */
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; padding: 8px 10px 26px; display: grid; grid-template-columns: repeat(4, 1fr); background: rgba(255,255,255,.94); backdrop-filter: blur(12px); border-top: 1px solid var(--line); z-index: 4; }
.tabbar__item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; border: 0; background: none; color: var(--ink-400); font-size: 11px; font-weight: 600; cursor: pointer; }
.tabbar__item.is-on { color: var(--sw-blue-600); }
.tabbar__mentor { color: var(--sw-blue-700); }
.tabbar__mic { width: 40px; height: 30px; border-radius: 15px; display: grid; place-items: center; background: var(--sw-blue-600); color: #fff; margin-top: -4px; }
.tabbar--demo { position: static; height: auto; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-md); }

/* Top bar */
.topbar { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; justify-content: space-between; padding: 4px 12px 6px; background: rgba(255,255,255,.94); backdrop-filter: blur(12px); }
.topbar__title { font-size: 17px; font-weight: 600; margin: 0; }

/* =========================== 1 Welcome =========================== */
.screen--welcome { background: var(--sw-gradient-soft); padding: 8px 24px 40px; min-height: 100%; }
.welcome__top { padding: 8px 0 0; }
.welcome__body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 16px; padding: 24px 0; }
.welcome__badge { align-self: flex-start; display: inline-flex; gap: 6px; align-items: center; padding: 6px 12px; border-radius: var(--r-pill); background: var(--surface); border: 1px solid var(--sw-blue-100); color: var(--sw-blue-700); font-size: 12.5px; font-weight: 600; }
.welcome__title { font-size: 34px; line-height: 40px; letter-spacing: -0.025em; font-weight: 650; margin: 8px 0 0; text-wrap: balance; }
.welcome__lede { font-size: 19px; line-height: 26px; color: var(--ink-700); }
.welcome__copy { color: var(--ink-500); }
.welcome__list { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
.welcome__list li { display: flex; gap: 10px; align-items: center; font-size: 14.5px; color: var(--ink-700); }
.welcome__list .ic { color: var(--sw-blue-600); width: 30px; height: 30px; padding: 7px; border-radius: 9px; background: var(--surface); border: 1px solid var(--line); }
.welcome__foot { display: grid; gap: 14px; }

/* =========================== 2 Story =========================== */
.screen--story { padding: 0 20px 40px; gap: 18px; min-height: 100%; }
.story__head { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; }
.story__intro { display: grid; gap: 6px; }
.player { display: grid; gap: 12px; }
.player__frame { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: var(--r-xl); background: linear-gradient(170deg, #1f3a8f 0%, #2a56d8 70%, #4a72e6 100%); color: #fff; overflow: hidden; cursor: pointer; }
.player__flag { position: absolute; top: 14px; left: 14px; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; padding: 4px 8px; border-radius: 6px; background: rgba(255,255,255,.14); color: rgba(255,255,255,.88); z-index: 2; }
.scene { position: absolute; inset: 0; padding: 64px 24px 24px; display: flex; flex-direction: column; justify-content: center; gap: 8px; animation: sceneIn 700ms var(--ease); }
@keyframes sceneIn { from { opacity: 0; transform: scale(.98); } to { opacity: 1; transform: none; } }
.scene__chapter { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.7); }
.scene__big { font-size: 52px; line-height: 1; font-weight: 650; letter-spacing: -0.035em; }
.scene__label { font-size: 18px; line-height: 24px; font-weight: 500; color: rgba(255,255,255,.9); max-width: 260px; text-wrap: balance; }
.scene__sub { color: rgba(255,255,255,.75); font-size: 14px; }
.scene__ridge { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 26%; color: rgba(255,255,255,.08); }
.scene--end { align-items: flex-start; }
.scene__done { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.18); }
.player__paused { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,20,50,.25); }
.player__paused .ic { width: 64px; height: 64px; padding: 18px; border-radius: 50%; background: rgba(255,255,255,.95); color: var(--sw-blue-700); }
.captions { font-size: 15px; line-height: 22px; color: var(--ink-900); background: var(--canvas); border-radius: var(--r-md); padding: 12px 14px; min-height: 68px; }
.player__progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.seg-bar { height: 16px; border: 0; background: none; padding: 6px 0; cursor: pointer; }
.seg-bar span { display: block; height: 4px; border-radius: 2px; background: var(--sw-blue-600); box-shadow: inset 0 0 0 0 transparent; }
.seg-bar { position: relative; }
.seg-bar::before { content: ""; position: absolute; left: 0; right: 0; top: 6px; height: 4px; border-radius: 2px; background: var(--line); }
.seg-bar span { position: relative; }
.player__chapters { display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-400); margin-top: -4px; }
.player__chapters .is-on { color: var(--ink-900); font-weight: 600; }
.player__controls { display: flex; justify-content: center; align-items: center; gap: 24px; }
.play-btn { width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--ink-900); color: #fff; display: grid; place-items: center; cursor: pointer; }
.story__foot { margin-top: auto; }

/* =========================== 3 Home =========================== */
.home-head { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px 0 20px; }
.home-head__actions { display: flex; gap: 4px; align-items: center; }
.score-card { display: flex; gap: 16px; align-items: center; }
.score-card__text { display: grid; gap: 6px; }
.score-card__link { display: inline-flex; gap: 2px; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--sw-blue-600); }
.sec-head { display: flex; justify-content: space-between; align-items: baseline; }
.sec-head h2 { font-size: 15px; font-weight: 600; margin: 0; }
.priority { font-size: 18px; line-height: 25px; font-weight: 600; letter-spacing: -0.01em; }
.focus-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.focus { padding: 10px 12px; border-radius: var(--r-md); background: var(--canvas); display: grid; gap: 2px; font-size: 12px; color: var(--ink-500); border-left: 0; }
.focus strong { font-size: 13.5px; color: var(--ink-900); font-weight: 600; line-height: 18px; }
.focus--warn { background: var(--warn-50); }
.focus--ok { background: var(--ok-50); }
.next-step { display: grid; gap: 8px; padding: 18px; }
.next-step h3 { margin: 0; font-size: 18px; line-height: 24px; letter-spacing: -0.01em; }
.next-step .row-2 { margin-top: 6px; }
.journey-mini { display: flex; align-items: center; gap: 14px; }
.journey-mini__track { display: flex; gap: 5px; align-items: center; flex: none; }
.jm-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--ink-300); }
.jm-dot--completed { background: var(--sw-blue-600); border-color: var(--sw-blue-600); }
.jm-dot--in_progress { border-color: var(--sw-blue-600); box-shadow: 0 0 0 3px var(--sw-blue-100); background: var(--surface); }
.jm-dot--needs_review { border-color: var(--warn-600); background: var(--warn-50); }
.journey-mini__now { flex: 1; display: grid; min-width: 0; }
.journey-mini__now strong { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.review-row { display: flex; gap: 12px; align-items: flex-start; }
.review-row__ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: var(--sw-blue-50); color: var(--sw-blue-600); flex: none; }
.review-row strong { display: block; font-size: 14.5px; margin: 2px 0; }
.mentor-cta { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: var(--r-lg); border: 0; background: var(--ink-900); color: #fff; text-align: left; cursor: pointer; }
.mentor-cta strong { display: block; font-size: 16px; }
.mentor-cta .small { color: rgba(255,255,255,.7); }
.mentor-cta__orb { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--sw-blue-600); box-shadow: 0 0 0 6px rgba(74,114,230,.25); flex: none; }

/* =========================== 5 Plan =========================== */
.plan-strip { display: flex; gap: 8px; overflow-x: auto; padding: 4px 20px 10px; scrollbar-width: none; position: sticky; top: 50px; z-index: 2; background: rgba(255,255,255,.94); }
.plan-strip::-webkit-scrollbar { display: none; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 8px; }
.fact { padding: 12px; border: 1px solid var(--line); border-radius: var(--r-md); display: grid; gap: 2px; }
.fact span { font-size: 12px; color: var(--ink-500); }
.fact strong { font-size: 18px; letter-spacing: -0.01em; }
.fact em { font-style: normal; font-size: 12px; color: var(--warn-600); font-weight: 600; }
.rec { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); overflow: hidden; transition: border-color var(--dur-1); }
.rec.is-open { border-color: var(--sw-blue-200); }
.rec__head { width: 100%; display: flex; gap: 10px; align-items: flex-start; padding: 16px; border: 0; background: none; text-align: left; cursor: pointer; }
.rec__head h3 { margin: 0 0 4px; font-size: 16px; line-height: 22px; }
.rec__chev { color: var(--ink-400); transition: transform var(--dur-2) var(--ease); flex: none; margin-top: 2px; }
.is-open > * > .rec__chev, .is-open .rec__head .rec__chev, .is-open .ms__head .rec__chev { transform: rotate(180deg); }
.rec__chart { padding: 0 16px 14px; }
.rec__body { padding: 0 16px 16px; display: grid; gap: 14px; animation: screenIn var(--dur-2) var(--ease); }
.qa { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: qa; }
.qa li { padding-left: 30px; position: relative; counter-increment: qa; }
.qa li::before { content: counter(qa); position: absolute; left: 0; top: 0; width: 20px; height: 20px; border-radius: 50%; background: var(--sw-blue-50); color: var(--sw-blue-700); font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.qa__q { font-size: 12.5px; font-weight: 600; color: var(--ink-500); }
.qa p { font-size: 14.5px; line-height: 21px; margin-top: 2px; }
.pending { display: grid; justify-items: start; gap: 8px; padding: 20px; border: 1px dashed var(--ink-300); border-radius: var(--r-lg); color: var(--ink-500); }
.pending h3 { margin: 0; color: var(--ink-900); font-size: 16px; }

/* Charts */
.chart { margin: 0; display: grid; gap: 8px; }
.chart figcaption { font-size: 11.5px; color: var(--ink-400); }
.chart--score { grid-template-columns: auto 1fr; align-items: center; gap: 12px; }
.bars { display: grid; gap: 12px; }
.bars__row { display: grid; gap: 5px; }
.bars__meta { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--ink-500); }
.bars__meta strong { color: var(--ink-900); font-size: 13.5px; }
.bars__track { height: 10px; border-radius: 5px; background: var(--line-soft); overflow: hidden; }
.bars__fill { height: 100%; border-radius: 5px; animation: grow 900ms var(--ease); transform-origin: left; }
.bar--cash { background: var(--sw-blue-600); }
.bar--debt { background: var(--warn-600); }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.gtl { position: relative; height: 70px; margin: 0 34px; }
.gtl__line { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--line); }
.gtl__pt { position: absolute; top: 0; transform: translateX(-50%); display: grid; justify-items: center; gap: 2px; text-align: center; width: 90px; }
.gtl__dot { width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--sw-blue-600); margin: 5px 0 6px; }
.gtl__pt.is-now .gtl__dot { background: var(--sw-blue-600); box-shadow: 0 0 0 4px var(--sw-blue-100); }
.gtl__k { font-size: 13px; font-weight: 650; }
.gtl__v { font-size: 11.5px; color: var(--ink-500); line-height: 14px; }
.two-goals { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
.two-goals > div:not(.tg__vs) { padding: 12px; border-radius: var(--r-md); background: var(--sw-blue-50); display: grid; gap: 2px; }
.tg__k { font-size: 11px; color: var(--ink-500); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.tg__s { font-size: 12px; color: var(--ink-500); }
.tg__vs { font-size: 12px; color: var(--ink-400); }

/* =========================== 6/8 Progress =========================== */
.ms-sum { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.ms-list { list-style: none; margin: 0; padding: 0; display: grid; }
.ms { display: grid; grid-template-columns: 28px 1fr; gap: 12px; }
.ms__rail { position: relative; display: flex; flex-direction: column; align-items: center; padding-top: 14px; }
.ms__line { flex: 1; width: 2px; background: var(--line); margin: 6px 0 -14px; }
.ms--completed .ms__line { background: var(--sw-blue-200); }
.ms__card { border: 1px solid var(--line); border-radius: var(--r-lg); margin-bottom: 10px; background: var(--surface); }
.ms--in_progress .ms__card { border-color: var(--sw-blue-200); box-shadow: var(--sh-1); }
.ms__head { width: 100%; display: flex; gap: 10px; padding: 14px; border: 0; background: none; text-align: left; cursor: pointer; align-items: flex-start; }
.ms__head strong { font-size: 15px; line-height: 21px; display: block; }
.ms--completed .ms__head strong { color: var(--ink-500); }
.ms__meta { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
.ms__body { padding: 0 14px 14px; display: grid; gap: 10px; animation: screenIn var(--dur-2) var(--ease); }
.ms__set { display: grid; gap: 6px; padding-top: 10px; border-top: 1px solid var(--line-soft); }
.ms__set .seg { display: grid; grid-template-columns: 1fr 1fr; }
.ms__set .seg button { flex: 1; justify-content: center; padding: 0 6px; font-size: 11.5px; }
.ms__praise { margin: 0 14px 12px; display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--sw-blue-50); color: var(--sw-blue-700); font-size: 13.5px; font-weight: 600; animation: screenIn var(--dur-3) var(--ease); }
.journey-sum { display: grid; gap: 6px; justify-items: start; }
.tl { display: grid; gap: 2px; }
.tl__h { font-size: 13px; font-weight: 600; color: var(--ink-500); margin: 4px 0 4px; }
.tl__item { display: flex; gap: 12px; align-items: center; padding: 12px 4px; border: 0; border-bottom: 1px solid var(--line-soft); background: none; text-align: left; width: 100%; cursor: pointer; }
div.tl__item { cursor: default; }
.tl__item strong { display: block; font-size: 14.5px; font-weight: 600; }
.tl__item .small { display: block; }
.tl__dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--ink-300); flex: none; margin: 0 5px; }
.tl__dot--blue { border-color: var(--sw-blue-600); background: var(--sw-blue-600); }
.tl__dot--ok { border-color: var(--ok-600); background: var(--ok-600); }
.tl__dot--warn { border-color: var(--warn-600); background: var(--warn-50); }
.tl__empty { padding: 8px 4px; }

/* =========================== 7 Check-in =========================== */
.screen--checkin { min-height: 100%; }
.checkin-progress { height: 3px; background: var(--line-soft); margin: 0 20px; border-radius: 2px; overflow: hidden; }
.checkin-progress span { display: block; height: 100%; background: var(--sw-blue-600); transition: width var(--dur-3) var(--ease); }
.checkin { padding-top: 24px; animation: screenIn var(--dur-3) var(--ease); }
.step-count { width: 40px; text-align: right; padding-right: 8px; }
.choice-list { display: grid; gap: 10px; }
.choice { display: flex; gap: 14px; align-items: center; padding: 16px; border-radius: var(--r-lg); border: 1px solid var(--line); background: var(--surface); font-size: 16px; font-weight: 550; text-align: left; cursor: pointer; transition: border-color var(--dur-1), background var(--dur-1); }
.choice > .ic { color: var(--sw-blue-600); flex: none; }
.choice:hover, .choice.is-on { border-color: var(--sw-blue-500); background: var(--sw-blue-50); }
.chip-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.share-preview { display: grid; gap: 6px; background: var(--canvas); border-style: dashed; }
.done { display: grid; gap: 14px; justify-items: center; text-align: center; padding-top: 40px; }
.done .btn { width: 100%; }
.done__mark { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--sw-blue-600); color: #fff; animation: pop var(--dur-3) var(--ease); box-shadow: 0 0 0 10px var(--sw-blue-50); margin-bottom: 8px; }

/* =========================== 4 Mentor =========================== */
.screen--mentor { min-height: 100%; background: linear-gradient(180deg, #f3f6ff 0%, #ffffff 46%); }
.mentor-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 14px 0 8px; }
.mentor-head__mid { display: grid; justify-items: center; gap: 4px; }
.mentor-head__mid strong { font-size: 15px; }
.topic-chip { display: inline-flex; gap: 5px; align-items: center; font-size: 12px; font-weight: 600; color: var(--sw-blue-700); background: var(--surface); border: 1px solid var(--sw-blue-100); border-radius: var(--r-pill); padding: 3px 10px; max-width: 220px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mentor-stage { display: grid; justify-items: center; gap: 14px; padding: 26px 20px 8px; }
.mentor-state { font-size: 14.5px; color: var(--ink-700); font-weight: 550; min-height: 22px; text-align: center; }
.interrupt-hint { display: inline-flex; gap: 6px; align-items: center; font-size: 12px; color: var(--sw-blue-700); background: var(--sw-blue-50); padding: 4px 10px; border-radius: var(--r-pill); animation: screenIn var(--dur-3) var(--ease); }

.orb { position: relative; width: 196px; height: 196px; display: grid; place-items: center; }
.orb__halo { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle, rgba(74,114,230,.20) 0%, rgba(74,114,230,0) 68%); transition: transform var(--dur-3) var(--ease), opacity var(--dur-3); }
.orb__ring { position: absolute; inset: 22px; border-radius: 50%; border: 1.5px solid var(--sw-blue-200); }
.orb__core { position: relative; width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #5b80ec 0%, #2a56d8 55%, #1f45b8 100%); display: grid; place-items: center; color: #fff; box-shadow: 0 18px 40px rgba(42,86,216,.28); transition: background var(--dur-3), box-shadow var(--dur-3), transform var(--dur-3) var(--ease); }
.wave { display: flex; gap: 3px; align-items: center; height: 56px; }
.wave span { width: 3px; border-radius: 2px; background: rgba(255,255,255,.92); height: calc(56px * var(--h) * .22); transition: height var(--dur-2); }
.orb--listening .wave span, .orb--interrupted .wave span { animation: wv 900ms ease-in-out infinite alternate; }
.orb--speaking .wave span { animation: wv 620ms ease-in-out infinite alternate; }
@keyframes wv { from { height: calc(56px * var(--h) * .2); } to { height: calc(56px * var(--h)); } }
.orb--ready .orb__halo { animation: breathe 3.6s ease-in-out infinite; }
.orb--listening .orb__halo, .orb--interrupted .orb__halo { transform: scale(1.12); }
.orb--listening .orb__ring, .orb--interrupted .orb__ring { animation: ripple 1.6s ease-out infinite; }
.orb--listening .orb__core, .orb--interrupted .orb__core { background: radial-gradient(circle at 35% 30%, #ffffff 0%, #eef3ff 100%); color: var(--sw-blue-600); box-shadow: 0 0 0 2px var(--sw-blue-200), 0 18px 40px rgba(42,86,216,.18); }
.orb--listening .wave span, .orb--interrupted .wave span { background: var(--sw-blue-600); }
.orb--thinking .orb__ring { border-style: dashed; animation: spin 6s linear infinite; }
.orb--thinking .orb__core { transform: scale(.94); }
.orb--speaking .orb__halo { animation: breathe 1.4s ease-in-out infinite; }
.orb--muted .orb__core, .orb--error .orb__core { background: var(--line-soft); color: var(--ink-500); box-shadow: none; }
.orb--muted .orb__halo, .orb--error .orb__halo { opacity: 0; }
.orb--muted .orb__ring { border-color: var(--line); }
.orb--error .orb__ring { border-color: #efc9c5; }
.orb--error .orb__core { color: var(--err-600); background: var(--err-50); }
.orb__dots { display: flex; gap: 7px; }
.orb__dots span { width: 9px; height: 9px; border-radius: 50%; background: #fff; animation: dot 1.2s ease-in-out infinite; }
.orb__dots span:nth-child(2) { animation-delay: .15s; } .orb__dots span:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
@keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes ripple { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.22); opacity: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

.transcript { flex: 1; min-height: 150px; max-height: 260px; overflow-y: auto; padding: 8px 22px; display: grid; gap: 12px; align-content: start; scrollbar-width: none; }
.line { font-size: 15.5px; line-height: 23px; color: var(--ink-900); }
.line__who { display: block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-400); margin-bottom: 2px; }
.line--you { color: var(--ink-700); }
.line--mentor .line__who { color: var(--sw-blue-600); }
.line.is-cut { color: var(--ink-400); }
.cut-tag { display: inline-block; margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--sw-blue-700); background: var(--sw-blue-50); border-radius: 5px; padding: 1px 6px; vertical-align: middle; }
.caret { display: inline-block; width: 2px; height: 16px; background: var(--sw-blue-600); margin-left: 3px; vertical-align: -2px; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.prompts { display: grid; gap: 8px; justify-items: start; }
.prompt { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 14px; font-size: 14px; text-align: left; cursor: pointer; color: var(--ink-700); }
.prompt:hover { border-color: var(--sw-blue-200); color: var(--ink-900); }
.mentor-error { flex: 1; }
.mentor-controls { display: flex; justify-content: space-around; align-items: center; padding: 12px 28px 8px; margin-top: auto; }
.ctl { display: grid; justify-items: center; gap: 4px; border: 0; background: none; font-size: 11.5px; font-weight: 600; color: var(--ink-500); cursor: pointer; width: 64px; }
.ctl .ic { width: 48px; height: 48px; padding: 13px; border-radius: 50%; background: var(--line-soft); color: var(--ink-700); }
.ctl.is-on .ic { background: var(--ink-900); color: #fff; }
.ctl--end .ic { background: var(--err-50); color: var(--err-600); }
.mic-main { width: 76px; height: 76px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--sw-blue-600); color: #fff; cursor: pointer; box-shadow: 0 10px 24px rgba(42,86,216,.3); transition: transform var(--dur-1), background var(--dur-2); }
.mic-main:active { transform: scale(.95); }
.mic-main--listening, .mic-main--interrupted { background: var(--surface); color: var(--sw-blue-600); box-shadow: 0 0 0 2px var(--sw-blue-600), 0 10px 24px rgba(42,86,216,.2); }
.mic-main--muted { background: var(--ink-700); }
.mic-main:disabled { background: var(--line); color: var(--ink-400); box-shadow: none; cursor: not-allowed; }
.mentor-privacy { display: flex; justify-content: center; gap: 5px; align-items: center; font-size: 11px; color: var(--ink-400); padding: 4px 20px 34px; text-align: center; }

/* =========================== Advisor =========================== */
.adv { flex: 1; display: grid; grid-template-columns: 232px 1fr; min-height: calc(100vh - 57px); }
.adv-side { background: var(--surface); border-right: 1px solid var(--line); padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; }
.adv-side__brand { padding: 0 8px; }
.adv-side nav { display: grid; gap: 2px; }
.adv-side__item { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; font-size: 14px; color: var(--ink-500); font-weight: 550; }
.adv-side__item.is-on { background: var(--sw-blue-50); color: var(--sw-blue-700); }
.adv-side__item em { font-style: normal; font-size: 10px; font-weight: 700; background: var(--sw-blue-600); color: #fff; border-radius: 5px; padding: 1px 5px; margin-left: auto; }
.adv-side__note { margin-top: auto; color: var(--ink-400); padding: 0 8px; }
.adv-main { padding: 22px max(16px, 3vw) 48px; display: grid; gap: 18px; align-content: start; min-width: 0; max-width: 1240px; }
.adv-crumbs { display: flex; gap: 6px; align-items: center; }
.adv-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.adv-banner { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line); color: var(--ink-500); flex-wrap: wrap; }
.adv-table { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow-x: auto; }
.adv-tr { display: grid; grid-template-columns: minmax(220px, 2fr) 120px 110px 170px 130px 110px 24px; gap: 12px; align-items: center; padding: 14px 18px; border: 0; border-bottom: 1px solid var(--line-soft); background: none; width: 100%; min-width: 960px; text-align: left; cursor: pointer; font-size: 14px; }
.adv-tr:last-child { border-bottom: 0; }
button.adv-tr:hover { background: var(--canvas); }
.adv-th { cursor: default; font-size: 12px; font-weight: 600; color: var(--ink-500); text-transform: uppercase; letter-spacing: .04em; padding-block: 10px; background: var(--canvas); }
.adv-name { display: flex; gap: 12px; align-items: center; }
.adv-name > span:last-child { display: grid; gap: 4px; justify-items: start; }
.adv-score { display: flex; gap: 8px; align-items: center; }
.adv-fam { display: flex; gap: 14px; align-items: center; }
.adv-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; align-items: start; }
.adv-card { display: grid; gap: 12px; padding: 18px; }
.adv-card__h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.adv-sum { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.facts--inline { flex: 1; min-width: 220px; }
.adv-bar { height: 8px; border-radius: 4px; background: var(--line-soft); overflow: hidden; }
.adv-bar span { display: block; height: 100%; background: var(--sw-blue-600); border-radius: 4px; transition: width var(--dur-3) var(--ease); }
.adv-ms { list-style: none; margin: 0; padding: 0; display: grid; }
.adv-ms li { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 14px; }
.adv-ms li:last-child { border-bottom: 0; }
.adv-insights { background: var(--sw-gradient-soft); border-color: var(--sw-blue-100); }
.adv-insights .h3 .ic { color: var(--sw-blue-600); }
.adv-insights ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.shared { display: grid; gap: 6px; justify-items: start; padding: 12px 0; border-bottom: 1px solid var(--line-soft); }
.shared p { font-size: 14.5px; }
.privacy { display: flex; gap: 8px; align-items: flex-start; color: var(--ink-500); padding: 10px 12px; border-radius: 10px; background: var(--canvas); }
.privacy .ic { flex: none; margin-top: 2px; }

/* =========================== Design system =========================== */
.ds { max-width: 1100px; margin: 0 auto; padding: 32px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 28px; }
.ds-intro { display: grid; gap: 12px; max-width: 760px; }
.ds-sec { display: grid; gap: 14px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); }
.ds-two { grid-template-columns: 1fr 1fr; gap: 28px; }
.ds-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.sw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.sw { display: flex; gap: 10px; align-items: center; }
.sw__chip { width: 40px; height: 40px; border-radius: 10px; border: 1px solid rgba(0,0,0,.06); flex: none; }
.sw div { display: grid; }
.grad-sample { flex: 1; min-width: 200px; height: 64px; border-radius: var(--r-md); display: grid; place-items: center; font-size: 13px; font-weight: 600; border: 1px solid var(--line); }
.grad-sample--accent { color: #fff; border: 0; }
.type-scale { display: grid; gap: 12px; }
.type-scale > div { display: grid; grid-template-columns: 200px 1fr; gap: 16px; align-items: baseline; padding-bottom: 12px; border-bottom: 1px solid var(--line-soft); }
.fig { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
.space-scale { display: flex; gap: 14px; align-items: flex-end; flex-wrap: wrap; }
.space-scale div { display: grid; gap: 4px; justify-items: center; }
.space-scale span { background: var(--sw-blue-200); border-radius: 2px; }
.radius-demo { width: 84px; height: 56px; border: 1px solid var(--line); background: var(--canvas); display: grid; place-items: center; }
.shadow-demo { width: 100px; height: 56px; border-radius: 12px; background: var(--surface); display: grid; place-items: center; }
.voice-states { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.vs { display: flex; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--line); border-radius: var(--r-md); }
.vs div { display: grid; }
.vs__dot { width: 30px; height: 30px; border-radius: 50%; background: var(--sw-blue-600); flex: none; }
.vs--listening .vs__dot { background: var(--surface); box-shadow: 0 0 0 2px var(--sw-blue-600); }
.vs--thinking .vs__dot { background: var(--sw-blue-200); }
.vs--speaking .vs__dot { box-shadow: 0 0 0 5px var(--sw-blue-100); }
.vs--interrupted .vs__dot { background: var(--surface); box-shadow: 0 0 0 2px var(--sw-blue-600), 0 0 0 6px var(--sw-blue-50); }
.vs--muted .vs__dot { background: var(--line); }
.vs--error .vs__dot { background: var(--err-50); box-shadow: 0 0 0 1.5px #efc9c5; }

/* =========================== Responsive =========================== */
@media (max-width: 1100px) {
  .stage { grid-template-columns: auto 260px; }
  .flow { display: none; }
}
@media (max-width: 760px) {
  .stage { grid-template-columns: minmax(0, 1fr); padding: 16px 0 32px; gap: 20px; }
  .controls { position: static; padding: 0 16px; }
  .phone { width: min(390px, 100vw); border-radius: 0; box-shadow: none; height: 844px; }
  .phone__status { display: none; }
  .adv { grid-template-columns: 1fr; }
  .adv-side { display: none; }
  .adv-grid, .ds-two { grid-template-columns: 1fr; }
  .type-scale > div { grid-template-columns: 1fr; gap: 4px; }
  .proto-bar__tag { display: none; }
}

.phone--tint-welcome .phone__status { background: #eef3ff; }
.phone--tint-mentor .phone__status { background: #f3f6ff; }

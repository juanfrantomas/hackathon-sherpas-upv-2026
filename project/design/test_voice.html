<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Probador Realtime Voice - Sherpas</title>
<style>
  :root {
    --bg: #f6f7fa; --card: #ffffff; --ink: #1c2230; --muted: #5f6878;
    --line: #e5e8ee; --accent: #2a56d8; --accent-hover: #1f45b8;
    --user-bg: #eef3ff; --bot-bg: #f2fbf6; --warn: #a46a12;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); padding: 24px 16px; }
  main { max-width: 820px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 8px; font-weight: 700; }
  p.desc { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(20,30,55,0.04); }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
  select, input { font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); font-size: 14px; }
  button { font: inherit; font-weight: 600; border: none; border-radius: 10px; padding: 10px 18px; cursor: pointer; transition: all 0.15s ease; font-size: 14px; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
  .btn-secondary { background: #eef1f6; color: var(--ink); }
  .btn-secondary:hover:not(:disabled) { background: #e0e5ee; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .status-row { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; color: var(--muted); align-items: center; }
  .status-row b { color: var(--ink); }
  .meter { width: 120px; height: 8px; background: #e8ecf3; border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
  .meter i { display: block; height: 100%; width: 0%; background: #17845a; transition: width 60ms linear; }
  
  .chat-box { display: flex; flex-direction: column; gap: 10px; max-height: 48vh; overflow-y: auto; padding-right: 4px; }
  .msg { padding: 10px 14px; border-radius: 12px; max-width: 82%; font-size: 14px; line-height: 1.45; }
  .msg.user { background: var(--user-bg); align-self: flex-end; border-bottom-right-radius: 3px; }
  .msg.bot { background: var(--bot-bg); align-self: flex-start; border-bottom-left-radius: 3px; }
  .meta { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 6px; font-size: 11px; font-weight: 600; background: #e3ebfd; color: #1f45b8; margin-bottom: 4px; }
  
  .quick-questions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .pill-btn { background: #f0f3f9; border: 1px solid var(--line); border-radius: 20px; padding: 6px 12px; font-size: 12px; cursor: pointer; color: var(--ink); }
  .pill-btn:hover { background: #e4e9f5; }
</style>
</head>
<body>
<main>
  <h1>🎙️ Realtime Voice - Test Bench</h1>
  <p class="desc">Voz bidireccional en tiempo real (< 1.2s de latencia) conectada a <b>FastAPI + WebSocket + Gemini Live</b>.</p>

  <div class="card">
    <div class="grid">
      <label>Familia / Caso
        <select id="caseSelect">
          <option value="timothy-melanie-weah" selected>Timothy & Melanie Weah (Auto: Refranero)</option>
          <option value="michael-carter">Michael Carter (Auto: Sencillo y Directo)</option>
          <option value="daniel-emily-johnson">Daniel & Emily Johnson (Auto: Sencillo)</option>
          <option value="samantha-lewis">Samantha Lewis (Auto: Formal Ejecutivo)</option>
        </select>
      </label>
      <label>Registro / Nivel de Lenguaje
        <select id="styleSelect">
          <option value="auto" selected>Automático (según perfil del cliente)</option>
          <option value="refranero">🌾 Cercano y con Refranes (Voz: Aoede)</option>
          <option value="sencillo">🏠 Sencillo / Sin tecnicismos (Voz: Puck)</option>
          <option value="formal">🎩 Formal / Ejecutivo (Voz: Charon)</option>
        </select>
      </label>
      <label>Modelo Realtime
        <select id="modelSelect">
          <option value="gemini-3.8-live" selected>gemini-3.8-live (Activo y rápido)</option>
          <option value="gpt-realtime-2.1-mini">gpt-realtime-2.1-mini</option>
          <option value="gpt-realtime-2.1">gpt-realtime-2.1</option>
        </select>
      </label>
      <button id="btnConnect" class="btn-primary">Conectar micrófono</button>
      <button id="btnDisconnect" class="btn-secondary" disabled>Desconectar</button>
    </div>
  </div>

  <div class="card">
    <div class="status-row">
      <span>Estado: <b id="lblStatus">Desconectado</b></span>
      <span>Voz asignada: <b id="lblVoice">–</b></span>
      <span>Micrófono: <span class="meter"><i id="micBar"></i></span></span>
      <span>Latencia primer audio: <b id="lblLatency">–</b></span>
    </div>
  </div>

  <div class="card">
    <div id="chatBox" class="chat-box"></div>
    <div class="quick-questions">
      <span style="font-size:12px; color:var(--muted); align-self:center;">O haz click para probar una pregunta en vivo:</span>
      <button class="pill-btn" onclick="sendTextQuestion('¿Qué deuda nos conviene liquidar primero?')">¿Qué deuda liquidar primero?</button>
      <button class="pill-btn" onclick="sendTextQuestion('¿Puedo comprar la casa en 2027 y retirarme a tiempo?')">¿Casa en 2027 y retiro?</button>
      <button class="pill-btn" onclick="sendTextQuestion('¿Cómo estamos de seguros de vida?')">¿Cómo estamos de seguros?</button>
    </div>
  </div>
</main>

<script>
let ws = null, audioCtx = null, micStream = null, micNode = null;
let playHead = 0, playingSources = [], currentBotBubble = null, currentBotText = "";
let lastVoiceTime = 0;

const $ = (id) => document.getElementById(id);

function appendBubble(role, text = "", meta = "") {
  const d = document.createElement("div");
  d.className = `msg ${role}`;
  d.innerHTML = `<div class="content">${text}</div>${meta ? `<span class="meta">${meta}</span>` : ""}`;
  $("chatBox").appendChild(d);
  $("chatBox").scrollTop = $("chatBox").scrollHeight;
  return d;
}

function b64(buffer) {
  let binary = "";
  const bytes = new Uint8Array(buffer);
  for (let i = 0; i < bytes.length; i += 0x8000) {
    binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  }
  return btoa(binary);
}

function playPcmChunk(b64Audio) {
  const bin = atob(b64Audio);
  const n = bin.length >> 1;
  const pcm = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    let v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8);
    if (v >= 0x8000) v -= 0x10000;
    pcm[i] = v / 0x8000;
  }
  const buf = audioCtx.createBuffer(1, n, 24000);
  buf.copyToChannel(pcm, 0);

  const src = audioCtx.createBufferSource();
  src.buffer = buf;
  src.connect(audioCtx.destination);

  playHead = Math.max(playHead, audioCtx.currentTime + 0.05);
  src.start(playHead);
  playHead += buf.duration;
  playingSources.push(src);
  src.onended = () => { playingSources = playingSources.filter(s => s !== src); };
}

function stopAudio() {
  for (const s of playingSources) { try { s.stop(); } catch(e){} }
  playingSources = [];
  playHead = audioCtx ? audioCtx.currentTime : 0;
}

async function connectRealtime() {
  $("btnConnect").disabled = true;
  $("lblStatus").textContent = "Pidiendo permiso de micrófono...";

  try {
    audioCtx = new AudioContext({ sampleRate: 24000 });
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 }
    });
    
    // Crear procesador de audio mono a 24 kHz
    const srcNode = audioCtx.createMediaStreamSource(micStream);
    const processor = audioCtx.createScriptProcessor(2048, 1, 1);
    srcNode.connect(processor);
    processor.connect(audioCtx.destination);

    processor.onaudioprocess = (e) => {
      const inputData = e.inputBuffer.getChannelData(0);
      let sum = 0;
      const pcm16 = new Int16Array(inputData.length);
      for (let i = 0; i < inputData.length; i++) {
        const s = Math.max(-1, Math.min(1, inputData[i]));
        pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
        sum += s * s;
      }
      const rms = Math.sqrt(sum / inputData.length);
      $("micBar").style.width = Math.min(100, rms * 400) + "%";

      if (rms > 0.02) lastVoiceTime = performance.now();
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: "input_audio_buffer.append",
          audio: b64(pcm16.buffer)
        }));
      }
    };
    micNode = processor;
  } catch (err) {
    alert("Error accediendo al micrófono: " + err.message);
    $("btnConnect").disabled = false;
    $("lblStatus").textContent = "Error de micrófono";
    return;
  }

  const cid = $("caseSelect").value;
  const model = $("modelSelect").value;
  const style = $("styleSelect").value;
  const host = location.hostname || "127.0.0.1";
  const wsUrl = `ws://${host}:8000/ws/voice/${cid}?model=${model}&style=${style}`;

  $("lblStatus").textContent = "Conectando al WebSocket...";
  ws = new WebSocket(wsUrl);

  ws.onopen = () => {
    $("lblStatus").textContent = "En línea. ¡Habla por el micrófono!";
    $("btnDisconnect").disabled = false;
    $("caseSelect").disabled = true;
    $("styleSelect").disabled = true;
    $("modelSelect").disabled = true;
  };

  ws.onmessage = (event) => {
    const data = JSON.parse(event.data);
    const t = data.type || "";

    if (t === "session_ready") {
      $("lblVoice").textContent = `${data.voice} (${data.style})`;
      appendBubble("bot", `👋 Conectado al plan de ${data.client_id}. Pregúntame lo que quieras.`, `Voz: ${data.voice}`);
    }
    else if (t === "input_audio_buffer.speech_started") {
      // El usuario empezó a hablar: cortamos la voz del bot inmediatamente
      stopAudio();
    }
    else if (t === "response.created") {
      currentBotBubble = appendBubble("bot", "…");
      currentBotText = "";
      if (lastVoiceTime) {
        const diff = Math.round(performance.now() - lastVoiceTime);
        $("lblLatency").textContent = `${diff} ms`;
      }
    }
    else if (t === "audio_delta" || t === "response.output_audio.delta" || t === "response.audio.delta") {
      const chunk = data.audio_b64 || data.delta;
      if (chunk) playPcmChunk(chunk);
    }
    else if (t === "transcript_delta" || t === "response.output_audio_transcript.delta" || t === "response.audio_transcript.delta") {
      const delta = data.text || data.delta || "";
      currentBotText += delta;
      if (currentBotBubble) {
        currentBotBubble.querySelector(".content").textContent = currentBotText;
      }
    }
    else if (t === "tool_call") {
      appendBubble("bot", `🔍 Consultando en vivo la sección: <code>${data.section}</code>`);
    }
    else if (t === "user_transcript") {
      appendBubble("user", data.text);
    }
  };

  ws.onclose = () => {
    disconnectRealtime();
  };

  ws.onerror = (e) => {
    console.error("WS error:", e);
  };
}

function disconnectRealtime() {
  stopAudio();
  if (ws) { ws.close(); ws = null; }
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }

  $("btnConnect").disabled = false;
  $("btnDisconnect").disabled = true;
  $("caseSelect").disabled = false;
  $("styleSelect").disabled = false;
  $("modelSelect").disabled = false;
  $("lblStatus").textContent = "Desconectado";
  $("micBar").style.width = "0%";
}

function sendTextQuestion(q) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    alert("Primero haz click en 'Conectar micrófono' para abrir la sesión.");
    return;
  }
  appendBubble("user", q);
  ws.send(JSON.stringify({ type: "user_text", text: q }));
}

$("btnConnect").onclick = connectRealtime;
$("btnDisconnect").onclick = disconnectRealtime;
</script>
</body>
</html>
